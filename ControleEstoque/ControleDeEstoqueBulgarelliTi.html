<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulgarelli - Controle de Estoque TI</title>
  
  <!-- Favicon Oficial Bulgarelli na aba do navegador -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><text x='15' y='72' font-family='Georgia, serif' font-size='68' font-weight='900' fill='white'>B</text><path d='M68 28 h22 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-12 l-4 5 v-5 h-2 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4 z' fill='%23dc2626'/><circle cx='76' cy='37' r='2' fill='white'/><circle cx='82' cy='37' r='2' fill='white'/><circle cx='88' cy='37' r='2' fill='white'/></svg>">
  
  <!-- Framework Tailwind CSS para Estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Biblioteca de Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Biblioteca React & ReactDOM (Modo Standalone) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Compilador Babel para processar JSX direto no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-white text-slate-900 selection:bg-red-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // --- Estados da Aplicação ---
      const [darkMode, setDarkMode] = useState(false);
      const [activeTab, setActiveTab] = useState('inventory'); // Controle da aba ativa ('inventory', 'history', 'categories')
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [stockFilter, setStockFilter] = useState('all'); // Filtro de nível de estoque ('all', 'low', 'normal')

      // Categorias pré-cadastradas para o Departamento de TI
      const [categories, setCategories] = useState([
        { id: 'mouse', name: 'Mouse', icon: 'mouse' },
        { id: 'keyboard', name: 'Teclado', icon: 'keyboard' },
        { id: 'monitor', name: 'Monitor', icon: 'monitor' },
        { id: 'hdmi', name: 'Cabo HDMI', icon: 'cable' },
        { id: 'dp', name: 'Cabo DisplayPort', icon: 'cable' },
        { id: 'headset', name: 'Headset', icon: 'headphones' },
        { id: 'notebook', name: 'Notebook', icon: 'laptop' },
        { id: 'desktop', name: 'Máquina / Desktop', icon: 'cpu' },
      ]);

      // Lista inicial de equipamentos no estoque (com persistência LocalStorage)
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('bulgarelli_inventory_items');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return [
          { id: '1', code: 'BULG-MSE-01', name: 'Mouse Sem Fio Dell WM126', category: 'mouse', quantity: 12, minQuantity: 5, unitPrice: 75.00, location: 'Armário TI - Prateleira A' },
          { id: '2', code: 'BULG-MSE-02', name: 'Mouse USB Logitech B100', category: 'mouse', quantity: 3, minQuantity: 5, unitPrice: 40.00, location: 'Armário TI - Prateleira A' },
          { id: '3', code: 'BULG-KBD-01', name: 'Teclado USB Dell KB216', category: 'keyboard', quantity: 8, minQuantity: 4, unitPrice: 85.00, location: 'Armário TI - Prateleira A' },
          { id: '4', code: 'BULG-MON-01', name: 'Monitor Dell 23.8" Full HD P2422H', category: 'monitor', quantity: 2, minQuantity: 3, unitPrice: 1100.00, location: 'Estoque Bancada TI' },
          { id: '5', code: 'BULG-CBL-01', name: 'Cabo HDMI 2.0 1.8m', category: 'hdmi', quantity: 15, minQuantity: 6, unitPrice: 25.00, location: 'Gaveta Cabos 01' },
          { id: '6', code: 'BULG-CBL-02', name: 'Cabo DisplayPort 1.4 1.8m', category: 'dp', quantity: 4, minQuantity: 5, unitPrice: 35.00, location: 'Gaveta Cabos 01' },
          { id: '7', code: 'BULG-HST-01', name: 'Headset Logitech H390 USB', category: 'headset', quantity: 1, minQuantity: 4, unitPrice: 220.00, location: 'Armário TI - Prateleira B' },
          { id: '8', code: 'BULG-NTB-01', name: 'Notebook Dell Latitude 3420 i5 16GB', category: 'notebook', quantity: 3, minQuantity: 2, unitPrice: 4500.00, location: 'Cofre TI' },
          { id: '9', code: 'BULG-DTK-01', name: 'Desktop OptiPlex 3090 i5 8GB', category: 'desktop', quantity: 1, minQuantity: 2, unitPrice: 3800.00, location: 'Cofre TI' }
        ];
      });

      // Histórico de auditoria (Entradas e Saídas registradas)
      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('bulgarelli_inventory_logs');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return [
          {
            id: 'log-1',
            date: new Date(Date.now() - 3600000 * 5).toISOString(),
            itemId: '1',
            itemName: 'Mouse Sem Fio Dell WM126',
            type: 'IN',
            quantity: 10,
            reason: 'Reposição de Estoque (Compra)',
            recipient: '-',
            responsible: 'Suporte TI'
          },
          {
            id: 'log-2',
            date: new Date(Date.now() - 3600000 * 2).toISOString(),
            itemId: '7',
            itemName: 'Headset Logitech H390 USB',
            type: 'OUT',
            quantity: 2,
            reason: 'Entrega para novo colaborador',
            recipient: 'Mariana (Recursos Humanos)',
            responsible: 'Suporte TI'
          }
        ];
      });

      // Estados de Controle das Telas Modais
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isMovementModalOpen, setIsMovementModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [selectedItemForMove, setSelectedItemForMove] = useState(null);
      const [movementType, setMovementType] = useState('OUT');

      // Formulários
      const [newItemForm, setNewItemForm] = useState({
        name: '', category: 'mouse', quantity: 0, minQuantity: 5, unitPrice: 0, location: '', code: ''
      });

      const [movementForm, setMovementForm] = useState({
        quantity: 1, reason: 'Entrega para novo colaborador', recipient: '', responsible: ''
      });

      const [newCatName, setNewCatName] = useState('');

      // Salvar dados no armazenamento local do navegador (LocalStorage)
      useEffect(() => {
        localStorage.setItem('bulgarelli_inventory_items', JSON.stringify(items));
        if (window.lucide) window.lucide.createIcons();
      }, [items]);

      useEffect(() => {
        localStorage.setItem('bulgarelli_inventory_logs', JSON.stringify(logs));
        if (window.lucide) window.lucide.createIcons();
      }, [logs]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, darkMode, isAddModalOpen, isMovementModalOpen]);

      // Funções de manipulação do estoque
      const handleSaveItem = (e) => {
        e.preventDefault();
        if (!newItemForm.name.trim()) return;

        if (editingItem) {
          setItems(items.map(item => item.id === editingItem.id ? {
            ...item,
            name: newItemForm.name,
            category: newItemForm.category,
            quantity: Number(newItemForm.quantity),
            minQuantity: Number(newItemForm.minQuantity),
            unitPrice: Number(newItemForm.unitPrice),
            location: newItemForm.location,
            code: newItemForm.code || item.code
          } : item));
        } else {
          const createdItem = {
            id: Date.now().toString(),
            code: newItemForm.code || `BULG-${newItemForm.category.toUpperCase().slice(0, 3)}-${Math.floor(100 + Math.random() * 900)}`,
            name: newItemForm.name,
            category: newItemForm.category,
            quantity: Number(newItemForm.quantity),
            minQuantity: Number(newItemForm.minQuantity),
            unitPrice: Number(newItemForm.unitPrice) || 0,
            location: newItemForm.location || 'Estoque TI'
          };
          setItems([createdItem, ...items]);

          if (Number(newItemForm.quantity) > 0) {
            setLogs([{
              id: Date.now().toString(),
              date: new Date().toISOString(),
              itemId: createdItem.id,
              itemName: createdItem.name,
              type: 'IN',
              quantity: Number(newItemForm.quantity),
              reason: 'Cadastro Inicial de Item',
              recipient: '-',
              responsible: 'Sistema TI'
            }, ...logs]);
          }
        }

        setIsAddModalOpen(false);
        setEditingItem(null);
      };

      const handleMovementSubmit = (e) => {
        e.preventDefault();
        if (!selectedItemForMove) return;

        const moveQty = Number(movementForm.quantity);
        if (moveQty <= 0) return;

        if (movementType === 'OUT' && moveQty > selectedItemForMove.quantity) {
          alert('Quantidade solicitada maior do que a disponível em estoque!');
          return;
        }

        const newQty = movementType === 'IN' 
          ? selectedItemForMove.quantity + moveQty 
          : selectedItemForMove.quantity - moveQty;

        setItems(items.map(item => item.id === selectedItemForMove.id ? { ...item, quantity: newQty } : item));

        const newLog = {
          id: Date.now().toString(),
          date: new Date().toISOString(),
          itemId: selectedItemForMove.id,
          itemName: selectedItemForMove.name,
          type: movementType,
          quantity: moveQty,
          reason: movementForm.reason,
          recipient: movementType === 'OUT' ? movementForm.recipient : '-',
          responsible: movementForm.responsible || 'Técnico TI'
        };

        setLogs([newLog, ...logs]);
        setIsMovementModalOpen(false);
        setSelectedItemForMove(null);
      };

      const handleDeleteItem = (id) => {
        if (window.confirm('Tem certeza que deseja remover este item do estoque?')) {
          setItems(items.filter(item => item.id !== id));
        }
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;
        const catId = newCatName.toLowerCase().replace(/\s+/g, '-');
        setCategories([...categories, { id: catId, name: newCatName, icon: 'package' }]);
        setNewCatName('');
      };

      const openQuickMove = (item, type) => {
        setSelectedItemForMove(item);
        setMovementType(type);
        setMovementForm({
          quantity: 1,
          reason: type === 'OUT' ? 'Entrega para novo colaborador' : 'Reposição de Estoque',
          recipient: '',
          responsible: ''
        });
        setIsMovementModalOpen(true);
      };

      const startEditItem = (item) => {
        setEditingItem(item);
        setNewItemForm({
          name: item.name,
          category: item.category,
          quantity: item.quantity,
          minQuantity: item.minQuantity,
          unitPrice: item.unitPrice || 0,
          location: item.location || '',
          code: item.code || ''
        });
        setIsAddModalOpen(true);
      };

      // Função para exportar os dados em formato CSV para Excel
      const exportToCSV = () => {
        const headers = ['Código,Nome,Categoria,Quantidade,Estoque Mínimo,Localização,Preço Unitário (R$)'];
        const rows = items.map(i => `"${i.code}","${i.name}","${i.category}",${i.quantity},${i.minQuantity},"${i.location}",${i.unitPrice}`);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers, ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `Estoque_TI_Bulgarelli_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Filtragem dos itens de estoque
      const filteredItems = items.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              item.code.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.location.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        const matchesStock = stockFilter === 'all' 
          ? true 
          : stockFilter === 'low' 
            ? item.quantity <= item.minQuantity 
            : item.quantity > item.minQuantity;

        return matchesSearch && matchesCategory && matchesStock;
      });

      // Cálculo das métricas do painel
      const metrics = {
        totalTypes: items.length,
        totalItemsCount: items.reduce((acc, i) => acc + i.quantity, 0),
        lowStockCount: items.filter(i => i.quantity <= i.minQuantity).length,
        todayEntries: logs.filter(l => l.type === 'IN' && new Date(l.date).toDateString() === new Date().toDateString()).reduce((acc, l) => acc + l.quantity, 0),
        todayExits: logs.filter(l => l.type === 'OUT' && new Date(l.date).toDateString() === new Date().toDateString()).reduce((acc, l) => acc + l.quantity, 0),
      };

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-black text-white' : 'bg-white text-slate-900'} transition-colors duration-200`}>
          {/* Cabeçalho Principal (Navbar) */}
          <header className={`border-b ${darkMode ? 'bg-zinc-950 border-zinc-800' : 'bg-white border-slate-200'} sticky top-0 z-30 shadow-sm transition-colors duration-200`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
            
            {/* Logo Profissional da Bulgarelli (Reativa ao Tema Claro / Escuro) */}
            <div className="flex items-center space-x-3.5">
              <div className={`p-2.5 rounded-xl border flex items-center justify-center shadow-sm transition-colors duration-200 ${
                darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-slate-50 border-slate-200'
              }`}>
                <svg className="w-8 h-8" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  {/* Fundo do Ícone */}
                  <rect width="100" height="100" rx="20" fill={darkMode ? '#000000' : '#0f172a'} />
                  {/* Letra B com preenchimento em alto contraste */}
                  <path d="M26 22 H54 C66 22 74 28 74 38 C74 45 69 50 62 52 C71 55 76 61 76 70 C76 81 67 86 54 86 H26 V22 Z M40 34 V47 H52 C58 47 62 44 62 40.5 C62 37 58 34 52 34 H40 Z M40 57 V74 H54 C60 74 64 70.5 64 65.5 C64 60.5 60 57 54 57 H40 Z" fill="#ffffff"/>
                  {/* Ícone do balão de fala da inovação em vermelho da Bulgarelli */}
                  <path d="M66 24 h20 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-10 l-4 5 v-5 h-2 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z" fill="#dc2626"/>
                  <circle cx="73" cy="32" r="1.8" fill="white"/>
                  <circle cx="78" cy="32" r="1.8" fill="white"/>
                  <circle cx="83" cy="32" r="1.8" fill="white"/>
                </svg>
              </div>
              <div className="flex flex-col">
                <div className="flex items-baseline space-x-1">
                  <span className={`font-black text-2xl tracking-tight font-serif ${darkMode ? 'text-white' : 'text-slate-950'}`}>
                    Bulgarelli
                  </span>
                  <span className="w-2.5 h-2.5 rounded-full bg-red-600 inline-block ml-0.5 animate-pulse"></span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="text-[11px] font-black tracking-widest text-red-600 uppercase">
                    Recuperação & Inovação
                  </span>
                  <span className={`text-xs ${darkMode ? 'text-zinc-600' : 'text-slate-300'}`}>•</span>
                  <span className={`text-[11px] font-semibold ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>Sistema de TI</span>
                </div>
              </div>
            </div>

            {/* Abas de Navegação */}
                <nav className="hidden md:flex space-x-1">
                  <button
                    onClick={() => setActiveTab('inventory')}
                    className={`px-3.5 py-2 rounded-lg text-sm font-bold transition-all flex items-center space-x-2 ${
                      activeTab === 'inventory' 
                        ? 'bg-red-600 text-white shadow-sm shadow-red-600/40'
                        : (darkMode ? 'text-zinc-300 hover:bg-zinc-900 hover:text-white' : 'text-slate-700 hover:bg-slate-100')
                    }`}
                  >
                    <i data-lucide="package" className="w-4 h-4"></i>
                    <span>Estoque & Periféricos</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('history')}
                    className={`px-3.5 py-2 rounded-lg text-sm font-bold transition-all flex items-center space-x-2 ${
                      activeTab === 'history' 
                        ? 'bg-red-600 text-white shadow-sm shadow-red-600/40'
                        : (darkMode ? 'text-zinc-300 hover:bg-zinc-900 hover:text-white' : 'text-slate-700 hover:bg-slate-100')
                    }`}
                  >
                    <i data-lucide="history" className="w-4 h-4"></i>
                    <span>Histórico (Entradas/Saídas)</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('categories')}
                    className={`px-3.5 py-2 rounded-lg text-sm font-bold transition-all flex items-center space-x-2 ${
                      activeTab === 'categories' 
                        ? 'bg-red-600 text-white shadow-sm shadow-red-600/40'
                        : (darkMode ? 'text-zinc-300 hover:bg-zinc-900 hover:text-white' : 'text-slate-700 hover:bg-slate-100')
                    }`}
                  >
                    <i data-lucide="filter" className="w-4 h-4"></i>
                    <span>Categorias</span>
                  </button>
                </nav>

                {/* Botões de Ação do Cabeçalho */}
                <div className="flex items-center space-x-3">
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    className={`p-2 rounded-lg border transition-colors ${
                      darkMode 
                        ? 'bg-zinc-900 border-zinc-800 text-amber-400 hover:bg-zinc-800' 
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                    }`}
                    title="Alternar Tema Escuro/Claro"
                  >
                    <i data-lucide={darkMode ? "sun" : "moon"} className="w-5 h-5"></i>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Conteúdo Principal */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            
            {/* Card de Métricas do Estoque */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div className={`p-4 rounded-xl border ${darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>Total em Estoque</p>
                    <h3 className="text-2xl font-black mt-1">{metrics.totalItemsCount} <span className={`text-xs font-normal ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>unidades</span></h3>
                    <p className={`text-xs mt-1 ${darkMode ? 'text-zinc-500' : 'text-slate-500'}`}>{metrics.totalTypes} tipos de equipamentos</p>
                  </div>
                  <div className="p-3 bg-red-600/10 text-red-600 rounded-xl">
                    <i data-lucide="package" className="w-6 h-6"></i>
                  </div>
                </div>
              </div>

              <div className={`p-4 rounded-xl border ${
                metrics.lowStockCount > 0 
                  ? (darkMode ? 'bg-red-950/40 border-red-800' : 'bg-red-50 border-red-200')
                  : (darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200 shadow-sm')
              }`}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>Alertas de Reposição</p>
                    <h3 className={`text-2xl font-black mt-1 ${metrics.lowStockCount > 0 ? 'text-red-600' : ''}`}>
                      {metrics.lowStockCount} <span className={`text-xs font-normal ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>itens críticos</span>
                    </h3>
                    <p className={`text-xs mt-1 ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>
                      {metrics.lowStockCount > 0 ? 'Fazer pedido de compra' : 'Estoque em nível seguro'}
                    </p>
                  </div>
                  <div className={`p-3 rounded-xl ${metrics.lowStockCount > 0 ? 'bg-red-600 text-white shadow-md shadow-red-600/30 animate-pulse' : 'bg-emerald-500/10 text-emerald-500'}`}>
                    <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                  </div>
                </div>
              </div>

              <div className={`p-4 rounded-xl border ${darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>Entradas Hoje</p>
                    <h3 className="text-2xl font-black mt-1 text-emerald-500">+{metrics.todayEntries} <span className={`text-xs font-normal ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>itens</span></h3>
                    <p className={`text-xs mt-1 ${darkMode ? 'text-zinc-500' : 'text-slate-500'}`}>Reposições recebidas</p>
                  </div>
                  <div className="p-3 bg-emerald-500/10 text-emerald-500 rounded-xl">
                    <i data-lucide="arrow-down-left" className="w-6 h-6"></i>
                  </div>
                </div>
              </div>

              <div className={`p-4 rounded-xl border ${darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className={`text-xs font-bold uppercase tracking-wider ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>Saídas Hoje</p>
                    <h3 className="text-2xl font-black mt-1 text-amber-500">-{metrics.todayExits} <span className={`text-xs font-normal ${darkMode ? 'text-zinc-400' : 'text-slate-500'}`}>itens</span></h3>
                    <p className={`text-xs mt-1 ${darkMode ? 'text-zinc-500' : 'text-slate-500'}`}>Entregas para colaboradores</p>
                  </div>
                  <div className="p-3 bg-amber-500/10 text-amber-500 rounded-xl">
                    <i data-lucide="arrow-up-right" className="w-6 h-6"></i>
                  </div>
                </div>
              </div>
            </div>

            {/* Aba 1: Tabela de Estoque */}
            {activeTab === 'inventory' && (
              <div className="space-y-4">
                <div className={`p-4 rounded-xl border ${darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'} flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4`}>
                  <div className="relative flex-1">
                    <i data-lucide="search" className={`w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 ${darkMode ? 'text-zinc-500' : 'text-slate-400'}`}></i>
                    <input
                      type="text"
                      placeholder="Buscar equipamento por nome, patrimônio ou local..."

                        onChange={(e) => setNewItemForm({ ...newItemForm, code: e.target.value })}
                        className={`w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-red-600 ${
                          darkMode ? 'bg-black border-zinc-800 text-white' : 'bg-white border-slate-300 text-slate-800'
                        }`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className={`block text-xs font-bold uppercase mb-1 ${darkMode ? 'text-zinc-400' : 'text-slate-600'}`}>Quantidade Inicial</label>
                      <input
                        type="number"
                        min="0"
                        required
                        value={newItemForm.quantity}
                        onChange={(e) => setNewItemForm({ ...newItemForm, quantity: e.target.value })}
                        className={`w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-red-600 ${
                          darkMode ? 'bg-black border-zinc-800 text-white' : 'bg-white border-slate-300 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block text-xs font-bold uppercase mb-1 ${darkMode ? 'text-zinc-400' : 'text-slate-600'}`}>Estoque Mínimo (Alerta)</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={newItemForm.minQuantity}
                        onChange={(e) => setNewItemForm({ ...newItemForm, minQuantity: e.target.value })}
                        className={`w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-red-600 ${
                          darkMode ? 'bg-black border-zinc-800 text-white' : 'bg-white border-slate-300 text-slate-800'
                        }`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className={`block text-xs font-bold uppercase mb-1 ${darkMode ? 'text-zinc-400' : 'text-slate-600'}`}>Localização no Armário</label>
                      <input
                        type="text"
                        placeholder="Ex: Prateleira A2"
                        value={newItemForm.location}
                        onChange={(e) => setNewItemForm({ ...newItemForm, location: e.target.value })}
                        className={`w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-red-600 ${
                          darkMode ? 'bg-black border-zinc-800 text-white' : 'bg-white border-slate-300 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block text-xs font-bold uppercase mb-1 ${darkMode ? 'text-zinc-400' : 'text-slate-600'}`}>Preço Unitário (R$)</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        placeholder="0.00"
                        value={newItemForm.unitPrice}
                        onChange={(e) => setNewItemForm({ ...newItemForm, unitPrice: e.target.value })}
                        className={`w-full px-3 py-2 text-sm rounded-lg border outline-none focus:ring-2 focus:ring-red-600 ${
                          darkMode ? 'bg-black border-zinc-800 text-white' : 'bg-white border-slate-300 text-slate-800'
                        }`}
                      />
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className={`px-4 py-2 text-sm font-bold transition-colors ${darkMode ? 'text-zinc-400 hover:text-white' : 'text-slate-600 hover:text-slate-900'}`}
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-lg transition-colors shadow-md shadow-red-600/30"
                    >
                      {editingItem ? 'Salvar Alterações' : 'Cadastrar Equipamento'}
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Inicialização do elemento raiz do React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
